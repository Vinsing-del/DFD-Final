<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flight Booking System - DFD</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 20px; }
    h1, h2 { text-align: center; color: #2c3e50; }
    .dfd-container { max-width: 1100px; margin: 20px auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    svg { width: 100%; max-width: 1050px; margin: 0 auto; display: block; background: #fafafa; }
    .entity { fill: #dae8fc; stroke: #6c8ebf; stroke-width: 3; }
    .process { fill: #fff2cc; stroke: #d6b656; stroke-width: 4; }
    .store { fill: #ffe6cc; stroke: #d79b00; stroke-width: 3; }
    text { font-size: 13px; font-weight: bold; fill: #2c3e50; text-anchor: middle; dominant-baseline: middle; }
    .arrow { stroke: #34495e; stroke-width: 2.5; marker-end: url(#arrowhead); }
  </style>
</head>
<body>
  <h1>Flight Booking System - Data Flow Diagram (DFD)</h1>

  <!-- Level 0 -->
  <div class="dfd-container">
    <h2>Level 0 - Context Diagram</h2>
    <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg">
      <defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/></marker></defs>
      <rect x="380" y="200" width="240" height="110" rx="20" class="process"/>
      <text x="500" y="255" font-size="18">Flight Booking System</text>
      
      <rect x="80" y="120" width="140" height="70" rx="8" class="entity"/>
      <text x="150" y="155">User / Passenger</text>
      
      <rect x="780" y="80" width="140" height="70" rx="8" class="entity"/>
      <text x="850" y="115">Payment Gateway</text>
      
      <rect x="780" y="320" width="140" height="70" rx="8" class="entity"/>
      <text x="850" y="355">Airline System</text>
      
      <rect x="80" y="380" width="140" height="70" rx="8" class="entity"/>
      <text x="150" y="415">Email / SMS Service</text>

      <line x1="220" y1="155" x2="380" y2="230" class="arrow"/>
      <line x1="620" y1="255" x2="780" y2="120" class="arrow"/>
      <line x1="620" y1="280" x2="780" y2="350" class="arrow"/>
      <line x1="500" y1="310" x2="220" y2="415" class="arrow"/>
    </svg>
  </div>

  <!-- Level 1 -->
  <div class="dfd-container">
    <h2>Level 1 DFD</h2>
    <svg viewBox="0 0 1100 680" xmlns="http://www.w3.org/2000/svg">
      <defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/></marker></defs>
      
      <!-- Processes -->
      <rect x="80" y="80" width="160" height="70" rx="12" class="process"/>
      <text x="160" y="115">1.1 Search Flights</text>
      
      <rect x="380" y="180" width="160" height="70" rx="12" class="process"/>
      <text x="460" y="215">1.2 Review & Select</text>
      
      <rect x="80" y="320" width="160" height="70" rx="12" class="process"/>
      <text x="160" y="355">1.3 Authentication</text>
      
      <rect x="380" y="440" width="160" height="70" rx="12" class="process"/>
      <text x="460" y="475">1.4 Passenger Details</text>
      
      <rect x="720" y="280" width="160" height="70" rx="12" class="process"/>
      <text x="800" y="315">1.5 Payment Processing</text>
      
      <rect x="720" y="480" width="160" height="70" rx="12" class="process"/>
      <text x="800" y="515">1.6 Confirmation & Notify</text>

      <!-- Arrows -->
      <line x1="240" y1="115" x2="380" y2="200" class="arrow"/>
      <line x1="460" y1="250" x2="240" y2="355" class="arrow"/>
      <line x1="540" y1="215" x2="720" y2="300" class="arrow"/>
      <line x1="540" y1="475" x2="720" y2="520" class="arrow"/>
      <line x1="880" y1="315" x2="880" y2="480" class="arrow"/>
    </svg>
  </div>

  <p style="text-align:center; margin-top:30px; color:#666;">
    <strong>Copy the entire code above → Save as <code>flight-booking-dfd.html</code> → Open in browser</strong>
  </p>
</body>
</html>
